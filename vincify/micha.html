<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vincify</title>
         <link id="theme-css" rel="stylesheet" href="../css/index.css">
</head>
<style>
    .track {
  display: grid;
  grid-template-columns: 1fr 160px;  /* player | title */
  align-items: center;
  gap: .75rem;
}
</style>
<body>
    <select id="themeSelect">
        <option value="standard">Standard</option>
        <option value="retro">Retro</option>
        <option value="v7mode">V7 mode</option>
    </select>



<div class="player-list">
  
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/bertus vapecloud.mp3"></audio>
    <label for="t1" class="track-name">bertus vapecloud</label>
  </div>
  
  <div class="track">
    <audio id="t2" controls preload="metadata" src="./micha/aniek manjefiek.mp3"></audio>
    <label for="t2" class="track-name">aniek manjefiek</label>
  </div>
  
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/gigi-gigi-67.mp3"></audio>
    <label for="t1" class="track-name">gigi gigi 67</label>
  </div>
  
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/gooning-micha-1964-edition.mp3"></audio>
    <label for="t1" class="track-name">joel the goon</label>
  </div>
 
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/Joel on Windows.mp3"></audio>
    <label for="t1" class="track-name">joel on windows</label>
  </div>
  
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/Making Trouble in the Best Way.mp3"></audio>
    <label for="t1" class="track-name">making trouble in the best way</label>
  </div>
  
  <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/Micha Arch dih.mp3"></audio>
    <label for="t1" class="track-name">micha arch dih</label>
    </div>
     
    <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/Paper Dress.mp3"></audio>
    <label for="t1" class="track-name">paper dress</label>
    
    <div class="track">
    <audio id="t1" controls preload="metadata" src="./micha/special-island-gigedy-island.mp3"></audio>
    <label for="t1" class="track-name">special island gigady island</label>
  </div>

  </div>
</div>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
    if (theme === "retro") {
        themeCSS.href = "../css/retro.css";
        document.getElementById("site-logo").src = "images/vinci_98.png";
    } 
    
    else if (theme === "v7mode") {
        themeCSS.href = "../css/v7mode.css";
    } 
    
    else {
        themeCSS.href = "../css/index.css";
        document.getElementById("site-logo").src = "images/vincisoftware.png";
    }

    localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
    loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
    themeSelect.value = savedTheme;
    loadTheme(savedTheme);
}
</script>
</html>
