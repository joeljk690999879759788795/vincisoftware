<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vincify</title>
    <link id="theme-css" rel="stylesheet" href="../css/index.css">
</head>
<style>
    .track {
        display: grid;
        grid-template-columns: 1fr 160px;
        align-items: center;
        gap: .75rem;
    }
</style>
<body>
    <select id="themeSelect">
        <option value="standard">Standard</option>
        <option value="retro">Retro</option>
        <option value="v7mode">V7 mode</option>
    </select>

    <div class="player-list">
      
      <div class="track">
        <audio id="t1" controls preload="metadata" src="./jacko/Micha In The Matrix.mp3"></audio>
        <label for="t1" class="track-name">micha in the matrix</label>
      </div>

    </div>
    <a href="./fy.html">
      <button>back</button>
    </a>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
    if (theme === "retro") {
        themeCSS.href = "../css/retro.css";
        document.getElementById("site-logo").src = "images/vinci_98.png";
    } 
    else if (theme === "v7mode") {
        themeCSS.href = "../css/v7mode.css";
    } 
    else {
        themeCSS.href = "../css/index.css";
        document.getElementById("site-logo").src = "images/vincisoftware.png";
    }
    localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
    loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");
if (savedTheme) {
    themeSelect.value = savedTheme;
    loadTheme(savedTheme);
}
</script>
</html>
