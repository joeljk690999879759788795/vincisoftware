<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vincify</title>
         <link id="theme-css" rel="stylesheet" href="../css/vincidebt.css">
</head>
<body>
    <select id="themeSelect">
        <option value="standard">Standard</option>
        <option value="retro">Retro</option>
        <option value="v7mode">V7 mode</option>
    </select>

    <h1>the music of the futere is here</h1>
    <h3>on vincify you can listen to the newest songs </h3>
    <a href="./joel.html">
        <button>joel</button>
    </a>
     <a href="./micha.html">
        <button>micha</button>
    </a>
     <a href="./jacko/Micha In The Matrix.mp3">
        <button>jacko</button>
    </a>
    <a href="../index.html">
        <button>back</button>
    </a>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
    if (theme === "retro") {
        themeCSS.href = "../css/retro.css";
        document.getElementById("site-logo").src = "images/vinci_98.png";
    } 
    
    else if (theme === "v7mode") {
        themeCSS.href = "../css/v7mode.css";
    } 
    
    else {
        themeCSS.href = "../css/index.css";
        document.getElementById("site-logo").src = "images/vincisoftware.png";
    }

    localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
    loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
    themeSelect.value = savedTheme;
    loadTheme(savedTheme);
}
</script>
</html>
