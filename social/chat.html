<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Chatroom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Chatroom</h2>

<div id="name-area">
  <label>Jouw naam:</label>
  <input id="name-input" type="text" placeholder="Voer naam in..." maxlength="30">
  <button onclick="setName()">Opslaan</button>
  <span id="current-name"></span>
</div>

<div id="chat-box"></div>
<div id="status">Verbinden...</div>

<div id="input-area">
  <input id="msg-input" type="text" placeholder="Typ een bericht..." maxlength="500" onkeydown="if(event.key==='Enter')sendMsg()">
  <button onclick="sendMsg()">Verstuur</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, query, limitToLast }
  from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCQGXzrP3YcdRPES0VXg4aMUS0n_RGxDU",
  authDomain: "chatroom-6ecd0.firebaseapp.com",
  databaseURL: "https://chatroom-6ecd0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "chatroom-6ecd0",
  storageBucket: "chatroom-6ecd0.firebasestorage.app",
  messagingSenderId: "839931433584",
  appId: "1:839931433584:web:78ff7fb4ac6fbac0e9dab5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "messages");

const BANNED_WORDS = [
  "politiek","verkiezing","partij","pvv","vvd","d66","cda","pvda","groenlinks","premier","minister","kabinet","kamerlid","propaganda","campagne",
  "lgbtq","lgbt","homo","lesbi","biseksueel","transgender","nonbinair","queer","gay","lesbo","pride",
  "abortus","zwangerschapsafbreking",
  "allah","jezus","christus","bijbel","koran","thora","moslim","christen","katholiek","protestant","islam","jodendom","boeddhisme","hindoe","geloof","gebed","kerk","moskee","synagoge",
  "fuck","shit","kut","klootzak","godverdomme","godver","tering","kanker","tyfus","cholera","lul","pik","bitch","hoer","slet","eikel","mongool","debiel","neuken","naaien","reet",
  "racist","racisme","nazi","hitler","antisemiet","jihad","terrorist","homophobie","islamofobie","xenofobie","transfobie","seksisme","misogynie","fascisme"
];

let userName = localStorage.getItem("chatroom_name") || "";

function updateNameDisplay() {
  const el = document.getElementById("current-name");
  if (userName) {
    el.textContent = "Ingelogd als: " + userName;
    document.getElementById("name-input").value = userName;
  } else {
    el.textContent = "Geen naam ingesteld";
  }
}

function setName() {
  const input = document.getElementById("name-input").value.trim();
  if (!input) { alert("Voer een naam in."); return; }
  if (containsBannedWord(input)) { alert("Je naam bevat een verboden woord."); return; }
  userName = input;
  localStorage.setItem("chatroom_name", userName);
  updateNameDisplay();
}

function containsBannedWord(text) {
  const lower = text.toLowerCase();
  return BANNED_WORDS.some(w => lower.includes(w));
}

function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function addMessageToBox(msg) {
  const box = document.getElementById("chat-box");
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `<span class="name">[${escapeHtml(msg.time)}] ${escapeHtml(msg.name)}:</span> ${escapeHtml(msg.text)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  if (!userName) { alert("Stel eerst een naam in."); return; }
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;

  if (containsBannedWord(text)) {
    const box = document.getElementById("chat-box");
    const div = document.createElement("div");
    div.className = "msg blocked";
    div.textContent = "⚠️ Bericht geblokkeerd: verboden woord.";
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    input.value = "";
    return;
  }

  const now = new Date();
  const time = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  push(messagesRef, { name: userName, text, time });
  input.value = "";
}

// Live nieuwe berichten ontvangen (laatste 100 bij het laden)
onChildAdded(query(messagesRef, limitToLast(100)), snap => addMessageToBox(snap.val()));
document.getElementById("status").textContent = "Verbonden ✓";

window.setName = setName;
window.sendMsg = sendMsg;
updateNameDisplay();
</script>
</body>
</html>
