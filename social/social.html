<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinci social</title>
  <link id="theme-css" rel="stylesheet" href="../css/vincidebt.css">
</head>
<body>
<h1>Vinci social</h1>
<label for="themeSelect">Theme:</label>
<select id="themeSelect">
  <option value="standard">Standard</option>
  <option value="retro">Retro</option>
  <option value="v7mode">V7 mode</option>
</select>
<div class="vincidebt">
<h1>a good social meda made by the team at vinci</h1>

</div>
<a href="../index.html">
    <button>home</button>
</a>
<a href="./page/micha/micha_page.html">
    <button>micha</button>
</a>
<a href="./page/joel/joël_page.html">
    <button>joel</button>
</a>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
  if (theme === "retro") {
    themeCSS.href = "../css/retro.css";
  } else if (theme === "v7mode") {
    themeCSS.href = "../css/v7mode.css";
  } else {
    themeCSS.href = "../css/vincidebt.css";
  }

  localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
  loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
  themeSelect.value = savedTheme;
  loadTheme(savedTheme);
}
</script>
</html>
