<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA VI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Rajdhani', sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: url('Capture.png') center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }

    #startScreen .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(0, 0, 0, 0.5) 70%,
          rgba(0, 0, 0, 0.8) 100%);
    }

    .start-btn {
      position: relative;
      z-index: 2;
      padding: 18px 70px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: #e15bfc;
      color: #000;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      animation: breathe 3s ease-in-out infinite;
    }

    .start-btn:hover {
      background: #c58dc7;
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    @keyframes breathe {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(225, 91, 252, 0.4);
      }

      50% {
        box-shadow: 0 0 50px rgba(225, 91, 252, 0.8);
      }
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
    }

    #loadingVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fade-out {
      opacity: 0 !important;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <div class="overlay"></div>
    <button class="start-btn" onclick="startLoading()">Start Game</button>
  </div>

  <div id="loadingScreen">
    <!-- preload="auto" laadt de video al op de achtergrond -->
    <!-- geen muted zodat het geluid werkt -->
    <video id="loadingVideo" preload="auto" playsinline>
      <source src="./Loading.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const video = document.getElementById("loadingVideo");

    // Video alvast laden terwijl startscherm zichtbaar is
    video.load();

    // Naar gameplay.html als video klaar is
    video.addEventListener("ended", () => {
      window.location.href = "gameplay.html";
    });

    function startLoading() {
      const start = document.getElementById("startScreen");
      const loading = document.getElementById("loadingScreen");

      start.classList.add("fade-out");

      setTimeout(() => {
        start.style.display = "none";
        loading.style.display = "block";
        video.muted = false;
        video.volume = 1.0;
        video.play();
      }, 600);
    }
  </script>
</body>

</html>
