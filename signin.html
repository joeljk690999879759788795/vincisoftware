<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign inS</title>
     <link id="theme-css" rel="stylesheet" href="./css/vincidebt.css">
</head>
<body>
    <label for="themeSelect">Theme:</label>
<select id="themeSelect">
  <option value="standard">Standard</option>
  <option value="retro">Retro</option>
  <option value="v7mode">V7 mode</option>
</select>
      <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <label for="dih">creddit card:</label>
    <input type="password" id="dih" name="creddit card" required>
<a href="./index.html">
    <button type="submit">Sign In</button>
    </a>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
  if (theme === "retro") {
    themeCSS.href = "./css/retro.css";
  } else if (theme === "v7mode") {
    themeCSS.href = "./css/v7mode.css";
  } else {
    themeCSS.href = "./css/vincidebt.css";
  }

  localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
  loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
  themeSelect.value = savedTheme;
  loadTheme(savedTheme);
}
</script>
</html>
