<!DOCTYPE html>
<html lang="en">
  <head>
<link id="theme-css" rel="stylesheet" href="../css/index.css">
    <title>The Vinci phone</title>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body >
     <select id="themeSelect">
        <option value="standard">Standard</option>
        <option value="retro">Retro</option>
        <option value="v7mode">V7 mode</option>
    </select>
<div style="display:flex;align-items:flex-start;gap:20px;">
    <img src="../images/WhatsApp Image 2026-06-02 at 21.17.16.jpeg" alt="Vinci Phone" style="width:700px;height: 700px;;">
    
    <div id="Info">
        Our Vinci phone will release soon.<br><br>
        Stay tuned for more updates!<br><br>
        The phone will have a sleek design and powerful features.
        The phone wil have the vinci mark of certifaction <br>
    </div>
</div>
<p>contact for information</p>
  </body>
  <script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
  if (theme === "retro") {
    themeCSS.href = "../css/retro.css";
  } else if (theme === "v7mode") {
    themeCSS.href = "../css/v7mode.css";
  } else {
    themeCSS.href = "../css/index.css";
  }

  localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
  loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
  themeSelect.value = savedTheme;
  loadTheme(savedTheme);
}
</script>
</html>
