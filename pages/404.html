<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link id="theme-css" rel="stylesheet" href="../css/index.css">
</head>

<body>

    <div class="error">
        <h1>404</h1>
        <h2>PAGE NOT FOUND</h2>
        <p>The page you are looking for does not exist.</p>

        <a class="home" href="../index.html">GO HOME</a>
    </div>
    <select id="themeSelect">
        <option value="standard">Standard</option>
        <option value="retro">Retro</option>
        <option value="v7mode">V7 mode</option>
    </select>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
    if (theme === "retro") {
        themeCSS.href = "../css/retro.css";
    } else if (theme === "v7mode") {
        themeCSS.href = "../css/v7mode.css";
    } else {
        themeCSS.href = "../css/index.css";
    }

    localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
    loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
    themeSelect.value = savedTheme;
    loadTheme(savedTheme);
}
</script>
