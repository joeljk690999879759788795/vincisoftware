<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            background-color: rgb(177, 208, 219);
            font-style: italic;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
        }

        .error {
            border: 2px solid rgb(15, 14, 14);
            width: fit-content;
            margin: 80px auto 20px;
            padding: 20px;
            text-align: center;
            background-color: rgb(173, 233, 255);
        }

        .error h1 {
            font-size: 100px;
            margin: 0;
            color: rgb(0, 0, 0);
        }

        .error h2 {
            font-size: 30px;
            margin: 5px 0;
            color: rgb(15, 14, 14);
        }

        .error p {
            font-size: 18px;
            color: rgb(15, 14, 14);
        }

        .home {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px 20px;
            border: 2px solid rgb(15, 14, 14);
            background: rgb(27, 20, 94);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .home:hover {
            background: rgb(240, 228, 228);
        }
    </style>
</head>

<body>

    <div class="error">
        <h1>404</h1>
        <h2>PAGE NOT FOUND</h2>
        <p>The page you are looking for does not exist.</p>

        <a class="home" href="../index.html">GO HOME</a>
    </div>

</body>
</html>
