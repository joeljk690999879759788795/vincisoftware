<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinci Debt</title>
  <link id="theme-css" rel="stylesheet" href="../css/index.css">
</head>
<body>
<h1>Vinci Debt</h1>
<label for="themeSelect">Theme:</label>
<select id="themeSelect">
  <option value="standard">Standard</option>
  <option value="retro">Retro</option>
  <option value="v7mode">V7 mode</option>
</select>
<h1>customer suport</h1>
<h3>if you have a question about our product send a email to kabonkel@proton.me for free suport</h3>
<h3>include info </h3>
<a href="../index.html">
    <button>home</button>
</a>
</body>
<script>
const themeCSS = document.getElementById("theme-css");
const themeSelect = document.getElementById("themeSelect");

function loadTheme(theme) {
  if (theme === "retro") {
    themeCSS.href = "../css/retro.css";
  } else if (theme === "v7mode") {
    themeCSS.href = "../css/v7mode.css";
  } else {
    themeCSS.href = "../css/index.css";
  }

  localStorage.setItem("theme", theme);
}

themeSelect.addEventListener("change", function () {
  loadTheme(this.value);
});

const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
  themeSelect.value = savedTheme;
  loadTheme(savedTheme);
}
</script>
</html>
