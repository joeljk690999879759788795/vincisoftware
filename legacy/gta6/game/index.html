<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA VI Intro</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #clickscreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #clickscreen span {
            color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }
    </style>
</head>

<body>

    <video id="intro" muted playsinline>
        <source src="./intro.mp4" type="video/mp4">
    </video>

    <div id="clickscreen">
        <span>Klik om te starten</span>
    </div>

    <script>
        const intro = document.getElementById("intro");
        const clickscreen = document.getElementById("clickscreen");

        clickscreen.addEventListener("click", () => {
            clickscreen.style.display = "none";
            intro.muted = false;
            intro.play();
        });

        intro.addEventListener("ended", () => {
            window.location.href = "./gta6.html";
        });
    </script>
</body>

</html>
