<!doctype html>
<html>
<head><meta charset="utf-8"><title>Creators</title>
<style>
  ul li a {
    display: inline-block;
    padding: 10px 15px;
    margin: 5px 0;
    border: 2px solid #333;
    border-radius: 4px;
    background-color: #f5f5f5;
    color: #333;
    text-decoration: none;
    transition: all 0.2s;
  }
  ul li a:hover {
    background-color: #333;
    color: #f5f5f5;
  }
</style>
</head>
<body>
<h1>Creators</h1>
<ul id="list">
  <li>Loading creators…</li>
</ul>
<hr>
<script>
fetch('creators.json')
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    Object.keys(data)
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
      .forEach(name => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'creator.html?p=' + encodeURIComponent(name);
        a.textContent = name;
        li.appendChild(a);
        list.appendChild(li);
      });
  })
  .catch(() => {
    document.getElementById('list').textContent = 'Could not load creators.json';
  });
</script>
</body>
<footer>
    <small><pre>
        Html: Jacko
        Javascript: Jacko, Chatgpt
        Css: Jacko
    </pre></small>
    <br>
    <small><a href="about.html">About</a></small>
</footer>
</html>
